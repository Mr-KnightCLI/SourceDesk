services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sourcedesk
      POSTGRES_PASSWORD: sourcedesk
      POSTGRES_DB: sourcedesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sourcedesk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcedesk"]
      interval: 2s
      timeout: 3s
      retries: 10
volumes:
  sourcedesk-data:
